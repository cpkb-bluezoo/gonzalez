name: Performance comparison

# Compares Gonzalez with the JDK's parser and aalto-xml, and prints the tables
# of PERFORMANCE.md for the branch, tag or commit asked for: the main branch
# unless another is given. It is run by hand, from the Actions tab or with
#
#   gh workflow run performance.yml -f ref=my-branch
#
# The tables are shown on the summary page of the run and kept as an artifact.
# A hosted runner is shared and its hardware is not the same from one run to
# the next, so compare the columns of one run with each other, and not the
# figures with those of PERFORMANCE.md or of another run.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to measure'
        required: true
        default: 'main'
        type: string
      reps:
        description: 'Fresh JVMs each figure is the median of'
        required: true
        default: '5'
        type: string

# Two runs at once would measure each other.
concurrency:
  group: performance
  cancel-in-progress: false

permissions:
  contents: read

env:
  AALTO_VERSION: '1.4.0'
  STAX2_VERSION: '4.3.0'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Fetch the parsers to compare with
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/comparison"
          mkdir -p "$dir"
          central=https://repo1.maven.org/maven2
          fetch() {
            # fetch <path under Maven Central>: the jar, checked against the
            # SHA-1 that Maven Central publishes beside it
            local file="$dir/$(basename "$1")"
            curl -fsSL "$central/$1" -o "$file"
            curl -fsSL "$central/$1.sha1" -o "$file.sha1"
            echo "$(cut -d' ' -f1 "$file.sha1")  $file" | sha1sum -c -
          }
          fetch "com/fasterxml/aalto-xml/$AALTO_VERSION/aalto-xml-$AALTO_VERSION.jar"
          fetch "org/codehaus/woodstox/stax2-api/$STAX2_VERSION/stax2-api-$STAX2_VERSION.jar"
          echo "AALTO_JAR=$dir/aalto-xml-$AALTO_VERSION.jar" >> "$GITHUB_ENV"
          echo "STAX2_JAR=$dir/stax2-api-$STAX2_VERSION.jar" >> "$GITHUB_ENV"

      - name: Run the comparison
        env:
          BENCH_REF: ${{ inputs.ref }}
          REPS: ${{ inputs.reps }}
        run: |
          set -euo pipefail
          benchmark/external-compare/performance-tables.sh "$REPS" | tee performance.md

      - name: Show the tables on the summary page
        run: cat performance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the tables
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}
          path: performance.md
