name: Performance comparison

# Compares Gonzalez with the JDK's parser and aalto-xml, and prints the tables
# of PERFORMANCE.md for the branch or tag the run is started on: the main branch
# unless another is chosen. It runs "ant benchmark-compare" of that commit, so
# the commit must have the target. It is run by hand, from the Actions tab or with
#
#   gh workflow run performance.yml --ref my-branch
#
# There is deliberately no input naming something else to check out. A run can
# write to the Actions cache of the ref it is started on, so code from another
# commit, run from the main branch, could put entries in the cache that every
# other branch and tag restores from.
#
# The tables are shown on the summary page of the run and kept as an artifact.
# A hosted runner is shared and its hardware is not the same from one run to
# the next, so compare the columns of one run with each other, and not the
# figures with those of PERFORMANCE.md or of another run.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: 'Fresh JVMs each figure is the median of'
        required: true
        default: '5'
        type: string

# Two runs at once would measure each other.
concurrency:
  group: performance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # The build does the rest: it fetches aalto-xml and the French and German
      # novels, each checked against a checksum, and runs the comparison.
      - name: Run the comparison
        env:
          BENCH_REF: ${{ github.ref_name }}
          REPS: ${{ inputs.reps }}
        run: ant benchmark-compare -Dbenchmark.reps="$REPS"

      - name: Show the tables on the summary page
        run: cat build/performance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the tables
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}
          path: build/performance.md
